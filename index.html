<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2446">
<meta name="description" content="LINESIDE — a game about judgment. Renew a worn-out branch line, bring a 1961 railcar back to life and give a valley town its future back. Chapter 1: Make the Case.">
<meta property="og:title" content="LINESIDE — a game about judgment">
<meta property="og:description" content="Walk the line. Check the train. Win over the town. Face the Funding Panel. No scores on the buttons — just the calls you make.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LINESIDE — A Game About Judgment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/lineside.css">
</head>
<body>
<canvas id="world" aria-label="Harrowby and the Kestrel Vale Line — walk around and explore"></canvas>

<div id="hud" role="status">
  <div class="hud-left"><div class="hud-top"><div class="hud-ch" id="hudCh"></div><button class="jq" id="hudJQ" aria-label="Judgment Points and rank"></button></div><ol class="obj" id="obj" aria-label="Chapter objectives"></ol></div>
  <div class="hud-right"><div class="metrics" id="hudMetrics"></div><button class="iconbtn" id="hudMenu" aria-label="Open project board"></button></div>
</div>

<main>
  <section id="title" class="layer"></section>
  <section id="setup" class="layer"></section>
  <section id="chapter" class="layer" aria-live="polite"></section>
  <section id="talk" class="layer"></section>
  <section id="panel" class="layer"></section>
  <section id="report" class="layer"></section>
  <section id="board" class="layer"></section>
  <section id="share" class="layer"></section>
</main>
<div id="pad" aria-hidden="true"><div id="joy"><div id="knob"></div></div><button id="padA" aria-label="Interact">Ⓐ</button></div>
<div id="toast" role="status"></div>
<div id="ach" role="status" aria-live="polite"></div>
<div id="tip" role="status" aria-live="polite"></div>
<div id="live" class="sr" aria-live="polite"></div>
<noscript><p style="color:#fff;padding:20px">LINESIDE needs JavaScript to run.</p></noscript>

<script src="js/packs/kestrel-vale.js"></script>
<script src="js/portraits.js"></script>
<script src="js/scene.js"></script>
<script src="js/packs/kestrel-vale-world.js"></script>
<script src="js/world/sprites.js"></script>
<script src="js/world/level.js"></script>
<script src="js/world/atlas.js"></script>
<script src="js/world/tileart.js"></script>
<script src="js/world/atlas_hd.js"></script>
<script src="js/world/tileart_hd.js"></script>
<script src="js/world/hd/terrain.js"></script>
<script src="js/world/hd/buildings.js"></script>
<script src="js/world/hd/props.js"></script>
<script src="js/world/hd/interiors.js"></script>
<script src="js/world/hd/shadows.js"></script>
<script src="js/world/world.js"></script>
<script src="js/world/atmos.js"></script>
<script src="js/world/hd/depth_light.js"></script>
<script src="js/world/hd/depth.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
