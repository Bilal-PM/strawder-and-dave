<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2446">
<meta name="description" content="LINESIDE — a game about judgment. Reopen a closed Victorian railway through a valley that has waited 39 years for a train. Make the calls. Live with the ripples.">
<meta property="og:title" content="LINESIDE — a game about judgment">
<meta property="og:description" content="No scores on the buttons. No right answers on screen. Just the calls you make — and the ripples they send.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LINESIDE — A Game About Judgment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/lineside.css">
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<div id="hud" role="status">
  <div class="hud-ch" id="hudCh"></div>
  <div class="hud-right"><div class="metrics" id="hudMetrics"></div><div class="jq" id="hudJQ"></div><button class="iconbtn" id="hudMenu" aria-label="Open project board"></button></div>
</div>

<main>
  <section id="title" class="layer"></section>
  <section id="setup" class="layer"></section>
  <section id="chapter" class="layer" aria-live="polite"></section>
  <section id="talk" class="layer"></section>
  <section id="panel" class="layer"></section>
  <section id="report" class="layer"></section>
  <section id="board" class="layer"></section>
  <section id="share" class="layer"></section>
</main>
<div id="toast" role="status"></div>
<div id="live" class="sr" aria-live="polite"></div>
<noscript><p style="color:#fff;padding:20px">LINESIDE needs JavaScript to run.</p></noscript>

<script src="js/packs/kestrel-vale.js"></script>
<script src="js/portraits.js"></script>
<script src="js/scene.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
