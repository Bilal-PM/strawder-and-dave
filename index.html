<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Project Valley — Railway PM</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;background:#0e0a07;overflow:hidden;
    font-family:'Press Start 2P',monospace;color:#3a2210;
    image-rendering:pixelated;touch-action:none;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 30%,#2a1f15,#0e0a07)}
  #game{position:relative;width:100%;height:100%}
  canvas{display:block;image-rendering:pixelated}

  /* ---------- DOM screens ---------- */
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;z-index:20;padding:20px;overflow:auto;
    background:radial-gradient(circle at 50% 35%,#3a2a1c,#160f09)}
  .screen.on{display:flex}
  h1{font-size:32px;color:#f7c948;text-shadow:4px 4px 0 #8e5e1c,8px 8px 0 rgba(0,0,0,.4);
    letter-spacing:2px;line-height:1.4;margin-bottom:8px}
  .sub{font-size:9px;color:#d8b888;margin-bottom:22px;line-height:1.9;max-width:520px}
  .btn{font-family:inherit;font-size:11px;color:#3a2210;background:linear-gradient(#ffe9b0,#f3c860);
    border:0;border-bottom:4px solid #b07d1c;border-radius:8px;padding:13px 24px;margin:5px;
    cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .btn:active{transform:translateY(2px);border-bottom-width:2px}
  .btn.sec{background:linear-gradient(#e8d4b0,#c9a878);border-bottom-color:#8a6a3c}
  .btn.sm{font-size:9px;padding:9px 14px}
  .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0}
  .card{width:118px;background:#2e2114;border:2px solid #5a4226;border-radius:10px;
    padding:10px 8px;cursor:pointer}
  .card.sel{border-color:#f7c948;box-shadow:0 0 0 2px #f7c948 inset,0 0 14px rgba(247,201,72,.35)}
  .card canvas{margin:0 auto 6px;display:block;background:#caa063;border-radius:6px;
    image-rendering:pixelated}
  .card .nm{font-size:9px;color:#f0e0c0}
  .diffrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:4px 0}
  .diff{font-family:inherit;font-size:9px;color:#e8d4b0;background:#2e2114;border:2px solid #5a4226;
    border-radius:8px;padding:10px 14px;cursor:pointer}
  .diff.sel{border-color:#f7c948;color:#f7c948;box-shadow:0 0 0 2px #f7c948 inset}
  #diffDesc{font-size:7.5px;color:#c4a878;min-height:30px;max-width:420px;line-height:2;margin:6px auto 6px}
  #nameIn{font-family:inherit;font-size:11px;text-align:center;padding:10px;border-radius:8px;
    border:2px solid #5a4226;background:#1d150d;color:#ffe9b0;width:230px;margin:4px 0}
  .lbl{font-size:8px;color:#d8b888;letter-spacing:1px;margin:12px 0 4px}

  /* ---------- HUD ---------- */
  #hud{position:absolute;top:0;left:0;right:0;z-index:12;display:none;padding:7px 8px;pointer-events:none}
  #hud.on{display:block}
  .hudbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
    background:linear-gradient(#3a2a1c,#28190f);border:2px solid #7a5c3a;border-radius:10px;
    padding:6px 9px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
  .week{font-size:11px;color:#f7c948}.phase{font-size:6.5px;color:#d8b888;margin-top:3px}
  .metrics{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
  .met{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:46px}
  .met .mn{font-size:6px;color:#cbb08a}
  .bar{width:46px;height:8px;background:#1d150d;border:1px solid #5a4226;border-radius:4px;overflow:hidden}
  .fill{height:100%;width:70%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
  .met .mv{font-size:7px;color:#f0e0c0}
  .scoreboard{display:flex;flex-direction:column;align-items:flex-end;gap:1px;min-width:60px}
  .scv{font-size:13px;color:#f7c948}.stv{font-size:8px;color:#d8b888}
  .stv.hot{color:#ff7a3c}

  /* ---------- dialogue / prompt / toast ---------- */
  #dlg{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
    width:min(560px,95%);z-index:15;display:none}
  #dlg.on{display:block}
  .dbox{background:linear-gradient(#fff6e2,#f0dcb4);border:3px solid #7a5c3a;border-radius:12px;
    padding:13px 15px;box-shadow:0 6px 0 rgba(0,0,0,.3)}
  .dname{font-size:10px;color:#8a4a1e;margin-bottom:7px}
  .dname .role{font-size:7px;color:#b08858}
  .dtext{font-size:9px;color:#4a3018;line-height:1.95;min-height:30px;margin-bottom:9px}
  .dchoice{font-size:8.5px;color:#3a2210;background:#ffe9b0;border:2px solid #c79a4a;border-radius:8px;
    padding:9px 11px;margin:5px 0;cursor:pointer;line-height:1.7}
  .dchoice:active{transform:translateX(2px)}
  .dchoice .hint{display:block;font-size:6.5px;color:#9a7a48;margin-top:4px}
  .deltas{margin:5px 0;font-size:8px}.delta{display:inline-block;margin-right:8px}
  .prompt{position:absolute;z-index:13;display:none;font-size:8px;color:#fff;
    background:rgba(20,12,6,.85);border:1px solid #f7c948;border-radius:6px;padding:5px 8px;
    transform:translate(-50%,-100%);white-space:nowrap;pointer-events:none}
  .prompt.on{display:block}
  .toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:18;
    background:linear-gradient(#3a2a1c,#28190f);border:2px solid #f7c948;border-radius:10px;
    padding:9px 15px;font-size:8px;color:#ffe9b0;display:none;line-height:1.8;text-align:center;
    box-shadow:0 4px 0 rgba(0,0,0,.3)}
  .toast.on{display:block;animation:drop .4s}
  @keyframes drop{0%{transform:translateX(-50%) translateY(-12px);opacity:0}100%{transform:translateX(-50%) translateY(0);opacity:1}}

  /* ---------- touch ---------- */
  #touch{position:absolute;inset:0;z-index:11;display:none}
  #touch.on{display:block}
  .dpad{position:absolute;left:14px;bottom:16px;width:126px;height:126px}
  .dbtn{position:absolute;width:40px;height:40px;background:rgba(58,42,28,.85);border:2px solid #7a5c3a;
    border-radius:8px;color:#f7c948;font-size:13px;display:flex;align-items:center;justify-content:center}
  .du{left:43px;top:0}.dd{left:43px;top:84px}.dl{left:0;top:43px}.dr{left:84px;top:43px}
  #actBtn{position:absolute;right:18px;bottom:30px;width:64px;height:64px;border-radius:50%;
    background:rgba(247,201,72,.92);border:3px solid #b07d1c;color:#3a2210;font-size:9px;
    display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="wrap"><div id="game">

  <div id="title" class="screen on">
    <h1>PROJECT<br>VALLEY</h1>
    <div class="sub">A railway you build with people, not just track.<br>Lead the team. Make the calls. Open the line.</div>
    <button class="btn" id="btnNew">NEW GAME</button>
    <div class="sub" style="margin-top:20px;font-size:6.5px;opacity:.7">Move: WASD / Arrows&nbsp; · &nbsp;Talk: SPACE&nbsp; · &nbsp;Mobile: on-screen controls</div>
  </div>

  <div id="select" class="screen">
    <div class="lbl">CHOOSE YOUR PROJECT MANAGER</div>
    <div class="row" id="charRow"></div>
    <div class="lbl">DIFFICULTY</div>
    <div class="diffrow" id="diffRow">
      <button class="diff" data-d="kids">Apprentice</button>
      <button class="diff sel" data-d="standard">Manager</button>
      <button class="diff" data-d="pro">Director</button>
    </div>
    <div id="diffDesc"></div>
    <div class="lbl">YOUR NAME</div>
    <input id="nameIn" maxlength="12" placeholder="PM">
    <div><button class="btn" id="btnStart">START PROJECT →</button>
    <button class="btn sec sm" id="btnBack">Back</button></div>
  </div>

  <div id="hud">
    <div class="hudbar">
      <div><div class="week" id="hWeek">T-32</div><div class="phase" id="hPhase">Kick-Off</div></div>
      <div class="metrics" id="hMetrics"></div>
      <div class="scoreboard"><div class="scv" id="hScore">0</div><div class="stv" id="hStreak">—</div></div>
    </div>
  </div>

  <div class="prompt" id="prompt"></div>
  <div id="dlg"><div class="dbox" id="dbox"></div></div>
  <div class="toast" id="toast"></div>

  <div id="touch">
    <div class="dpad">
      <div class="dbtn du" data-k="up">▲</div><div class="dbtn dd" data-k="down">▼</div>
      <div class="dbtn dl" data-k="left">◀</div><div class="dbtn dr" data-k="right">▶</div>
    </div>
    <div id="actBtn" data-k="action">TALK</div>
  </div>

</div></div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.88.2/dist/phaser.min.js"></script>
<script>
/* =====================================================================
   PROJECT VALLEY — Phaser build (Milestone 1 vertical slice)
   Real LimeZu pixel-art assets (img/char, img/tile), verified frame coords.
   ===================================================================== */
const TS=16;                       // tile size (source + world)
const ZOOM=2;
const DESIGN_W=480, DESIGN_H=270;  // 16:9 internal resolution (FIT-scaled)

/* ---- LimeZu character idle sheets: 16x32, 6 frames/dir, order DOWN,UP,LEFT,RIGHT ---- */
const SHEETS=['adam','bob','amelia','alex'];
const DIRROW={down:0, up:6, left:12, right:18};

/* ---- furniture frames in interior.png (tile units: sx,sy,sw,sh) [verified] ---- */
const FURN={
  desk:[1,10,2,2], cabinet:[4,1,1,2], shelf:[4,14,2,2],
  rug:[13,10,3,5], sofa:[5,13,3,2], coffee:[11,12,1,1]
};
/* verified floor + wall tiles in rooms.png (tile units) */
const FLOOR_T=[6,11], WALL_T=[15,1], BASE_T=[6,5];

/* ---- player characters ---- */
const CHARS=[
  {id:'alex',  name:'Alex',  sheet:'adam'},
  {id:'jordan',name:'Jordan',sheet:'bob'},
  {id:'casey', name:'Casey', sheet:'amelia'},
  {id:'morgan',name:'Morgan',sheet:'alex'}
];

/* ---- map: 24 x 15 tiles. top 2 rows wall. ---- */
const MW=24, MH=15;
/* furniture placements [type, tileX, tileY, solid?] */
const PLACED=[
  ['desk',2,3,true], ['desk',7,3,true], ['desk',12,3,true], ['desk',17,3,true],
  ['cabinet',5,3,true], ['cabinet',20,3,true],
  ['shelf',21,6,true], ['shelf',1,6,true],
  ['rug',15,9,false],
  ['sofa',2,11,true], ['coffee',5,12,false],
  ['desk',9,11,true]   // break-area meeting table
];
/* ---- NPCs: stand near their desk, facing 'down' toward player ---- */
const NPCS=[
  {id:'sarah', name:'Sarah', role:'Design Lead',    sheet:'amelia', tx:3,  ty:5,  face:'down'},
  {id:'mike',  name:'Mike',  role:'Site Manager',   sheet:'bob',    tx:8,  ty:5,  face:'down'},
  {id:'priya', name:'Priya', role:'Comms Lead',     sheet:'amelia', tx:13, ty:5,  face:'down'},
  {id:'james', name:'James', role:'Commercial Mgr', sheet:'adam',   tx:18, ty:5,  face:'down'},
  {id:'emma',  name:'Emma',  role:'Safety Lead',    sheet:'alex',   tx:2,  ty:8,  face:'right'}
];

/* =====================================================================
   CONTENT (Kick-Off phase) — one decision per NPC
   ===================================================================== */
const DLG={
  sarah:{name:'Sarah',role:'Design Lead',
    text:"First day! The feasibility study isn't signed off yet. How should I approach the early design?",
    choices:[
      {t:"Get the design right early — invest the time.",hint:"Quality up, slower start.",e:{quality:5,schedule:-2,morale:1},flag:'designFirst'},
      {t:"Move fast, refine as we go.",hint:"Quick, risk of rework.",e:{schedule:4,quality:-3}},
      {t:"Align the whole team before deciding.",hint:"Smart leadership — builds buy-in.",e:{morale:4,quality:2,schedule:-1}}
    ]},
  mike:{name:'Mike',role:'Site Manager',
    text:"Boss, do we plan the build sequence now, or wait for the final design?",
    choices:[
      {t:"Plan the sequence now with what we know.",hint:"Proactive, small risk.",e:{schedule:4,morale:1}},
      {t:"Wait for design to be locked.",hint:"Safe, loses time.",e:{schedule:-3,quality:2}},
      {t:"Run both in parallel — overlap carefully.",hint:"Efficient if managed well.",e:{schedule:3,quality:1,safety:-1}}
    ]},
  priya:{name:'Priya',role:'Comms Lead',
    text:"Locals are already asking about disruption. Do we engage the community now or wait for firm dates?",
    choices:[
      {t:"Engage now — get ahead of the story.",hint:"Builds goodwill early.",e:{morale:3,quality:1},flag:'engagedEarly'},
      {t:"Wait until we have firm dates.",hint:"Less to say, looks quiet.",e:{morale:-1,schedule:1}},
      {t:"Set up a regular update channel.",hint:"Sustainable stakeholder mgmt.",e:{morale:2,quality:2}}
    ]},
  james:{name:'James',role:'Commercial Mgr',
    text:"The budget has only 10% contingency. Tight for a job this size. How do we treat it?",
    choices:[
      {t:"Protect contingency — release with rigour.",hint:"Disciplined finances.",e:{budget:5,morale:-1}},
      {t:"Spend early to de-risk delivery.",hint:"Front-loads cost.",e:{budget:-3,schedule:2,quality:1}},
      {t:"Review it weekly with the team.",hint:"Balanced, transparent.",e:{budget:3,morale:1}}
    ]},
  emma:{name:'Emma',role:'Safety Lead',
    text:"Before anyone sets foot on site, I want a safety culture baked in. Will you back me?",
    choices:[
      {t:"Absolutely — safety leads everything.",hint:"The right call. Builds trust.",e:{safety:5,morale:3,schedule:-1},flag:'safetyFirst'},
      {t:"Within reason — we can't gold-plate it.",hint:"Pragmatic but risky.",e:{safety:1,budget:1}},
      {t:"Let's not slow the team down yet.",hint:"Dangerous shortcut.",e:{safety:-4,schedule:2},flag:'safetyShortcut'}
    ]}
};
const REACT={
  sarah:{pos:["\"Brilliant — that's the kind of call that makes a design hold up.\"","\"Knew you'd get it. The build team will thank us.\""],neu:["\"Understood. I'll work with that.\""],neg:["\"Hmm. We may pay for that later — but it's your call.\""]},
  mike:{pos:["\"Now we're talking. I'll get the crew thinking ahead.\"","\"Good shout, boss — that'll save us grief on site.\""],neu:["\"Right you are. I'll crack on.\""],neg:["\"You're the boss... but the lads won't love standing about.\""]},
  priya:{pos:["\"Love it. Communities remember who talked to them first.\"","\"Great — I'll get the messaging out today.\""],neu:["\"Fine. I'll hold the line for now.\""],neg:["\"Silence has a way of writing its own story...\""]},
  james:{pos:["\"Sensible. The sponsor will respect that.\"","\"Good discipline — the numbers will behave.\""],neu:["\"Noted. I'll keep the ledger tidy.\""],neg:["\"That'll show up in the forecast, mark my words.\""]},
  emma:{pos:["\"Thank you. That's how everyone goes home safe.\"","\"That means a lot — I'll build the culture from day one.\""],neu:["\"Okay. I'll do what I can with that.\""],neg:["\"I'll log my concerns formally. This worries me.\""]}
};

/* =====================================================================
   STATE + DIFFICULTY
   ===================================================================== */
const S={
  charIdx:0, difficulty:'standard', name:'PM',
  metrics:{schedule:70,budget:70,safety:70,quality:70,morale:70},
  score:0, streak:0, bestStreak:0, decisions:0,
  week:32, phase:'Kick-Off & Feasibility',
  dlgOpen:false, talked:{}, echoFlags:{}
};
const DIFFICULTY={
  kids:    {penaltyMul:0.5,rewardMul:1.25,scoreMul:0.8,label:'Apprentice',
            desc:'Friendly mode — mistakes sting less and wins feel bigger. Great for newcomers and younger players.'},
  standard:{penaltyMul:1.0,rewardMul:1.0, scoreMul:1.0,label:'Manager',
            desc:'The balanced railway PM experience. Every choice matters.'},
  pro:     {penaltyMul:1.45,rewardMul:0.85,scoreMul:1.4,label:'Director',
            desc:'Unforgiving — trade-offs bite hard and there is little slack. For seasoned project managers.'}
};
const diff=()=>DIFFICULTY[S.difficulty]||DIFFICULTY.standard;
const METRIC_META=[
  {k:'schedule',n:'SCH',c:'#4aca8a'},{k:'budget',n:'BUD',c:'#f7c948'},
  {k:'safety',n:'SAF',c:'#e05577'},{k:'quality',n:'QTY',c:'#5b8ef5'},
  {k:'morale',n:'MOR',c:'#b08fd8'}
];

/* =====================================================================
   PHASER
   ===================================================================== */
let GAME=null, WORLD=null;

class Boot extends Phaser.Scene{
  constructor(){super('Boot');}
  preload(){
    this.load.image('rooms','img/tile/rooms.png');
    this.load.image('interior','img/tile/interior.png');
    SHEETS.forEach(s=>this.load.spritesheet('ch_'+s,'img/char/'+s+'_idle.png',{frameWidth:16,frameHeight:32}));
    // dust dot
    const c=document.createElement('canvas');c.width=4;c.height=4;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,4,4);
    this.textures.addCanvas('dot',c);
  }
  create(){
    // crop floor / wall / baseboard textures from rooms image
    const rimg=this.textures.get('rooms').getSourceImage();
    const crop=(key,tx,ty,w,h)=>{
      const ct=this.textures.createCanvas(key,w,h);
      ct.context.clearRect(0,0,w,h);
      ct.context.drawImage(rimg, tx*TS, ty*TS, w, h, 0,0,w,h); ct.refresh();
    };
    crop('floorTex',FLOOR_T[0],FLOOR_T[1],TS,TS);
    crop('wallTex', WALL_T[0], WALL_T[1], TS,TS);
    crop('baseTex', BASE_T[0], BASE_T[1], TS,6);
    // register furniture frames on interior texture
    const itex=this.textures.get('interior');
    for(const k in FURN){const f=FURN[k]; itex.add(k,0,f[0]*TS,f[1]*TS,f[2]*TS,f[3]*TS);}
    // character anims (per sheet)
    SHEETS.forEach(s=>{
      const key='ch_'+s;
      const mk=(dir,start)=>this.anims.create({key:s+'_'+dir,
        frames:this.anims.generateFrameNumbers(key,{start:start,end:start+5}),frameRate:8,repeat:-1});
      mk('down',0);mk('up',6);mk('left',12);mk('right',18);
    });
    this.scene.start('World');
  }
}

class World extends Phaser.Scene{
  constructor(){super('World');}
  create(){
    WORLD=this;
    const W=MW*TS, H=MH*TS;
    this.add.tileSprite(0,0,W,H,'floorTex').setOrigin(0,0).setDepth(-100);
    // top wall (2 rows) + baseboard trim
    this.add.tileSprite(0,0,W,TS*2,'wallTex').setOrigin(0,0).setDepth(-90);
    this.add.tileSprite(0,TS*2-6,W,6,'baseTex').setOrigin(0,0).setDepth(-89);

    this.solids=this.physics.add.staticGroup();
    const addSolid=(x,y,w,h)=>{const r=this.add.rectangle(x+w/2,y+h/2,w,h).setVisible(false);this.solids.add(r);};
    // bounds: top wall + invisible edges
    addSolid(0,0,W,TS*2-4);
    addSolid(-8,0,8,H); addSolid(W,0,8,H); addSolid(0,H,W,8);

    // furniture
    for(const p of PLACED){
      const [type,tx,ty,solid]=p; const f=FURN[type];
      const img=this.add.image(tx*TS,ty*TS,'interior',type).setOrigin(0,0);
      img.setDepth(type==='rug'?-50:(ty+f[3])*TS);     // rug under entities
      if(solid) addSolid(tx*TS+2,(ty+f[3]-1)*TS, f[2]*TS-4, TS-2); // footprint at base
    }

    // NPCs (immovable dynamic bodies)
    this.npc={};
    this.npcGroup=this.physics.add.group();
    NPCS.forEach(n=>{
      const s=this.physics.add.sprite(n.tx*TS+8, n.ty*TS+16,'ch_'+n.sheet,DIRROW[n.face]);
      s.body.setSize(10,6).setOffset(3,24); s.body.setImmovable(true); s.body.moves=false; s.refData=n;
      s.play(n.sheet+'_'+n.face);            // gentle idle breathing
      this.npcGroup.add(s);
      this.npc[n.id]=s;
    });

    // player
    const c=CHARS[S.charIdx];
    this.psheet=c.sheet;
    this.player=this.physics.add.sprite(11*TS+8,12*TS,'ch_'+c.sheet,DIRROW.down);
    this.player.body.setSize(10,6).setOffset(3,24);
    this.physics.add.collider(this.player,this.solids);
    this.physics.add.collider(this.player,this.npcGroup);
    this.pdir='down';

    this.physics.world.setBounds(0,0,W,H);
    this.cameras.main.setBounds(0,0,W,H);
    this.cameras.main.startFollow(this.player,true,0.12,0.12);
    this.cameras.main.setZoom(ZOOM);
    this.cameras.main.fadeIn(450);

    // input
    this.cursors=this.input.keyboard.createCursorKeys();
    this.keys=this.input.keyboard.addKeys('W,A,S,D');
    this.input.keyboard.on('keydown-SPACE',()=>this.interact());

    // ambient dust
    this.add.particles(0,0,'dot',{x:{min:0,max:W},y:{min:0,max:H},lifespan:4200,
      speedY:{min:-5,max:-1},speedX:{min:-3,max:3},scale:{start:0.5,end:0},
      alpha:{start:0.45,end:0},frequency:420,quantity:1,tint:0xfff0c0}).setDepth(9000);

    bindTouch(this);
    showHUD(); buildHUDMetrics(); updateHUD();
    this.nearNPC=null;
    toast('Welcome, '+S.name+'!','Kick-off week. Meet your team — walk up and press SPACE.');
  }

  face(dir,moving){
    this.pdir=dir;
    if(dir==='left'){this.player.setFlipX(false);}
    if(moving) this.player.play(this.psheet+'_'+dir,true);
    else {this.player.anims.stop(); this.player.setFrame(DIRROW[dir]);}
  }

  update(){
    if(!this.player)return;
    const sp=92;
    let vx=0,vy=0;
    if(S.dlgOpen){ this.player.setVelocity(0,0); this.player.anims.stop(); }
    else {
      const L=this.cursors.left.isDown||this.keys.A.isDown||TOUCH.left;
      const R=this.cursors.right.isDown||this.keys.D.isDown||TOUCH.right;
      const U=this.cursors.up.isDown||this.keys.W.isDown||TOUCH.up;
      const D=this.cursors.down.isDown||this.keys.S.isDown||TOUCH.down;
      if(L)vx=-sp;else if(R)vx=sp;
      if(U)vy=-sp;else if(D)vy=sp;
      if(vx&&vy){vx*=0.707;vy*=0.707;}
      this.player.setVelocity(vx,vy);
      const moving=vx!==0||vy!==0;
      let dir=this.pdir;
      if(Math.abs(vx)>Math.abs(vy)) dir=vx<0?'left':'right';
      else if(vy!==0) dir=vy<0?'up':'down';
      this.face(dir,moving);
    }
    this.player.setDepth(this.player.y);
    NPCS.forEach(n=>this.npc[n.id].setDepth(this.npc[n.id].y));
    // proximity
    let near=null,best=34;
    for(const n of NPCS){const s=this.npc[n.id];
      const d=Phaser.Math.Distance.Between(this.player.x,this.player.y,s.x,s.y);
      if(d<best){best=d;near=n;}}
    this.nearNPC=near; updatePrompt(this,near);
  }

  interact(){ if(S.dlgOpen)return; if(this.nearNPC) openDialogue(this.nearNPC.id); }
}

/* =====================================================================
   JUICE
   ===================================================================== */
function spawnPopup(x,y,text,color){
  if(!WORLD)return;
  const t=WORLD.add.text(x,y,text,{fontFamily:'"Press Start 2P",monospace',fontSize:'10px',
    color:color,stroke:'#1a120c',strokeThickness:4}).setOrigin(0.5).setDepth(99999);
  WORLD.tweens.add({targets:t,y:y-30,alpha:{from:1,to:0},duration:1050,ease:'Cubic.out',
    onComplete:()=>t.destroy()});
}
function burst(x,y,tint,n){
  if(!WORLD)return;
  const e=WORLD.add.particles(x,y,'dot',{lifespan:650,speed:{min:28,max:85},
    scale:{start:1.4,end:0},alpha:{start:1,end:0},tint:tint,emitting:false}).setDepth(99998);
  e.explode(n); WORLD.time.delayedCall(850,()=>e.destroy());
}

/* =====================================================================
   applyEffects — difficulty + score + streak + juice (single funnel)
   ===================================================================== */
function applyEffects(effects,ctx){
  ctx=ctx||{}; const d=diff(); let net=0; const shown=[];
  for(const k in effects){
    if(S.metrics[k]===undefined)continue;
    let v=effects[k]; const mul=v>0?d.rewardMul:d.penaltyMul;
    let scaled=Math.sign(v)*Math.max(1,Math.round(Math.abs(v)*mul));
    S.metrics[k]=Math.max(0,Math.min(100,S.metrics[k]+scaled));
    net+=scaled; shown.push({k,v:scaled});
  }
  if(ctx.suppressScore){updateHUD();return shown;}
  S.decisions++;
  if(net>0)S.streak++; else if(net<0)S.streak=0;
  S.bestStreak=Math.max(S.bestStreak,S.streak);
  const combo=1+Math.min(S.streak,6)*0.15;
  const pts=Math.round(net*d.scoreMul*10*(net>0?combo:1));
  S.score=Math.max(0,S.score+pts);
  const ax=ctx.anchor?ctx.anchor.x:(WORLD?WORLD.player.x:0);
  const ay=(ctx.anchor?ctx.anchor.y:(WORLD?WORLD.player.y:0))-20;
  if(pts!==0) spawnPopup(ax,ay,(pts>0?'+':'')+pts+(S.streak>=2&&net>0?'  x'+S.streak:''),pts>0?'#ffe24a':'#ff6a8a');
  if(net>=4){burst(ax,ay,0xffd84a,14); WORLD&&WORLD.cameras.main.flash(150,90,200,120,false);}
  else if(net>0){burst(ax,ay,0xffd84a,6);}
  if(net<0){WORLD&&WORLD.cameras.main.shake(170,0.006);WORLD&&WORLD.cameras.main.flash(110,180,40,60,false);}
  if(S.streak===3||S.streak===5){toast('🔥 '+S.streak+' GOOD CALLS IN A ROW!','Momentum is building — the team trusts your judgement.');burst(ax,ay,0xff8a3c,20);}
  updateHUD(); return shown;
}

/* =====================================================================
   DIALOGUE (DOM)
   ===================================================================== */
function tier(net){return net>=2?'pos':(net<=-2?'neg':'neu');}
function openDialogue(id){
  const d=DLG[id]; if(!d)return; S.dlgOpen=true;
  const box=document.getElementById('dbox');
  let h='<div class="dname">'+d.name+' <span class="role">('+d.role+')</span></div>';
  h+='<div class="dtext">'+d.text+'</div>';
  d.choices.forEach((c,i)=>{h+='<div class="dchoice" data-i="'+i+'">'+c.t+'<span class="hint">'+c.hint+'</span></div>';});
  box.innerHTML=h;
  box.querySelectorAll('.dchoice').forEach(el=>el.onclick=()=>chooseDialogue(id,+el.dataset.i));
  document.getElementById('dlg').classList.add('on');
}
function chooseDialogue(id,i){
  const d=DLG[id], choice=d.choices[i];
  const s=WORLD&&WORLD.npc[id]; const anchor=s?{x:s.x,y:s.y}:null;
  const shown=applyEffects(choice.e,{anchor});
  if(choice.flag)S.echoFlags[choice.flag]=S.week;
  S.talked[id]=true;
  let net=0; shown.forEach(x=>net+=x.v);
  const pool=REACT[id]||REACT.sarah; const lines=pool[tier(net)]||pool.neu;
  const line=lines[Math.floor(Math.random()*lines.length)];
  const names={schedule:'SCH',budget:'BUD',safety:'SAF',quality:'QTY',morale:'MOR'};
  const box=document.getElementById('dbox');
  let h='<div class="dname">'+d.name+' <span class="role">('+d.role+')</span></div>';
  h+='<div class="dtext">'+line+'</div><div class="deltas">';
  shown.forEach(x=>{const col=x.v>0?'#3a9a6a':'#c0405a';const ar=x.v>0?'▲':'▼';
    h+='<span class="delta" style="color:'+col+'">'+(x.v>0?'+':'')+x.v+' '+names[x.k]+' '+ar+'</span>';});
  h+='</div><div class="dchoice" data-close="1" style="text-align:center">Continue ▸</div>';
  box.innerHTML=h;
  box.querySelector('[data-close]').onclick=closeDialogue;
}
function closeDialogue(){document.getElementById('dlg').classList.remove('on');S.dlgOpen=false;}

/* =====================================================================
   HUD / PROMPT / TOAST
   ===================================================================== */
function showHUD(){document.getElementById('hud').classList.add('on');
  if('ontouchstart' in window||navigator.maxTouchPoints>0)document.getElementById('touch').classList.add('on');}
function buildHUDMetrics(){
  const c=document.getElementById('hMetrics');c.innerHTML='';
  METRIC_META.forEach(m=>{c.innerHTML+='<div class="met"><div class="mn">'+m.n+'</div>'+
    '<div class="bar"><div class="fill" id="fill_'+m.k+'" style="background:'+m.c+'"></div></div>'+
    '<div class="mv" id="mv_'+m.k+'"></div></div>';});
}
function updateHUD(){
  METRIC_META.forEach(m=>{const f=document.getElementById('fill_'+m.k);if(f)f.style.width=S.metrics[m.k]+'%';
    const v=document.getElementById('mv_'+m.k);if(v)v.textContent=S.metrics[m.k];});
  const sc=document.getElementById('hScore');if(sc)sc.textContent=S.score;
  const st=document.getElementById('hStreak');
  if(st){if(S.streak>0){st.textContent='🔥 x'+S.streak;st.className='stv hot';}else{st.textContent='—';st.className='stv';}}
  document.getElementById('hWeek').textContent=(S.week>0?'T-'+S.week:(S.week===0?'T-0':'T+'+(-S.week)));
  document.getElementById('hPhase').textContent=S.phase;
}
let _toastT=null;
function toast(title,sub){const el=document.getElementById('toast');
  el.innerHTML='<div style="color:#f7c948">'+title+'</div><div style="font-size:7px;color:#d8b888;margin-top:5px">'+(sub||'')+'</div>';
  el.classList.add('on');clearTimeout(_toastT);_toastT=setTimeout(()=>el.classList.remove('on'),2800);}
function updatePrompt(scene,npc){
  const el=document.getElementById('prompt');
  if(!npc||S.dlgOpen){el.classList.remove('on');return;}
  const s=scene.npc[npc.id], cam=scene.cameras.main, canvas=scene.game.canvas;
  const sx=(s.x-cam.worldView.x)*cam.zoom, sy=(s.y-26-cam.worldView.y)*cam.zoom;
  const cr=canvas.getBoundingClientRect(), gr=document.getElementById('game').getBoundingClientRect();
  el.style.left=(cr.left-gr.left+sx*(cr.width/canvas.width))+'px';
  el.style.top=(cr.top-gr.top+sy*(cr.height/canvas.height))+'px';
  el.textContent='SPACE — Talk to '+npc.name; el.classList.add('on');
}

/* =====================================================================
   TOUCH
   ===================================================================== */
const TOUCH={up:false,down:false,left:false,right:false};
function bindTouch(scene){
  document.querySelectorAll('.dbtn').forEach(b=>{const k=b.dataset.k;
    const on=e=>{e.preventDefault();TOUCH[k]=true;};const off=e=>{e.preventDefault();TOUCH[k]=false;};
    b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off);
    b.addEventListener('touchcancel',off);b.addEventListener('mousedown',on);window.addEventListener('mouseup',off);});
  const act=document.getElementById('actBtn');
  const fire=e=>{e.preventDefault();if(!S.dlgOpen)scene.interact();};
  act.addEventListener('touchstart',fire,{passive:false});act.addEventListener('mousedown',fire);
}

/* =====================================================================
   FLOW (DOM)
   ===================================================================== */
function buildCharCards(){
  const row=document.getElementById('charRow');row.innerHTML='';
  CHARS.forEach((c,i)=>{
    const card=document.createElement('div');card.className='card'+(i===S.charIdx?' sel':'');
    const pv=document.createElement('canvas');pv.width=16*3;pv.height=32*3;
    const img=new Image();
    img.onload=()=>{const x=pv.getContext('2d');x.imageSmoothingEnabled=false;
      x.drawImage(img,0,0,16,32,0,0,16*3,32*3);};
    img.src='img/char/'+c.sheet+'_idle.png';
    card.appendChild(pv);
    const nm=document.createElement('div');nm.className='nm';nm.textContent=c.name;card.appendChild(nm);
    card.onclick=()=>{S.charIdx=i;buildCharCards();};
    row.appendChild(card);
  });
}
function setDifficulty(d){S.difficulty=d;
  document.querySelectorAll('.diff').forEach(b=>b.classList.toggle('sel',b.dataset.d===d));
  document.getElementById('diffDesc').textContent=DIFFICULTY[d].desc;}
function startGame(){
  S.name=(document.getElementById('nameIn').value||'PM').slice(0,12);
  document.getElementById('title').classList.remove('on');
  document.getElementById('select').classList.remove('on');
  GAME=new Phaser.Game({type:Phaser.AUTO,parent:'game',backgroundColor:'#160f09',
    pixelArt:true,roundPixels:true,
    scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH,width:DESIGN_W,height:DESIGN_H},
    physics:{default:'arcade',arcade:{debug:false}},
    scene:[Boot,World]});
}
window.addEventListener('load',()=>{
  buildCharCards(); setDifficulty('standard');
  document.querySelectorAll('.diff').forEach(b=>b.onclick=()=>setDifficulty(b.dataset.d));
  document.getElementById('btnNew').onclick=()=>{document.getElementById('title').classList.remove('on');document.getElementById('select').classList.add('on');};
  document.getElementById('btnBack').onclick=()=>{document.getElementById('select').classList.remove('on');document.getElementById('title').classList.add('on');};
  document.getElementById('btnStart').onclick=startGame;
});
</script>
